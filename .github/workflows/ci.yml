name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gamenight-sdk:
    uses: ontola/gamenight/.github/workflows/godot-sdk-check.yml@main
  crowd-sound:
    uses: joepio/godot-crowd-sound/.github/workflows/sync-check.yml@main
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Godot 4.5.2
        id: godot
        uses: ontola/gamenight/.github/actions/setup-godot@main
        with:
          version: 4.5.2
      - name: Build and test
        shell: pwsh
        run: ./tools/build.ps1 -Godot "${{ steps.godot.outputs.godot }}"
      - name: Test packaged GameNight integration
        shell: pwsh
        run: |
          foreach ($teams in 1..3) {
            python tests/wire.py "$PWD/build/Ballkickers.exe" $teams
            if ($LASTEXITCODE -ne 0) { throw "Packaged integration failed for mode $teams" }
          }
      - name: Package portable download
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: ballkickers-windows
          path: |
            build/ballkickers-windows.zip
            build/SHA256SUMS.txt
          if-no-files-found: error
  release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ballkickers-windows
          path: release
      - name: Publish tested build and preview assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum --check SHA256SUMS.txt
          gh release create "$RELEASE_TAG" ballkickers-windows.zip SHA256SUMS.txt ../assets/preview.mp4 ../assets/gameplay.jpg ../assets/cover.png ../assets/icon.png --repo "$GITHUB_REPOSITORY" --verify-tag --title "Ballkickers $RELEASE_TAG" --notes-file ../docs/release-notes.md
