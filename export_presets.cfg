[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*,tools/*,experiments/*,captures/*,build/*,README.md,VALIDATION.md"
export_path="build/Ballkickers.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
application/modify_resources=false

[preset.1]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="third_party/*txt"
exclude_filter="docs/*,tests/*,tools/*,experiments/*,captures/*,build/*,assets/cover*,assets/gameplay*,assets/preview.mp4,assets/gamenight/*,README.md,VALIDATION.md"
export_path="build/web/index.html"

[preset.1.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true

html/head_include="<script src=\"bridge.js\"></script>"
